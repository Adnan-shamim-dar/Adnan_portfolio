<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Adnan Shamim Dar · The Strand</title>
<meta name="description" content="Adnan Shamim Dar's work, mapped onto a living DNA helix. Click any node to open its mind map." />
<link rel="canonical" href="https://adnan-shamim-dar.github.io/Adnan_portfolio/helix.html" />
<meta name="theme-color" content="#05070a" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="helix.css?v=2" />
</head>
<body>

<canvas id="back" aria-hidden="true"></canvas>
<div id="nodes-back" class="nodes" aria-hidden="true"></div>
<canvas id="front" aria-hidden="true"></canvas>
<div id="nodes-front" class="nodes"></div>

<aside class="panel">
  <div class="hero" id="hero">
    <p class="kick"><span class="dot"></span>The strand · experimental</p>
    <h1>Adnan Shamim Dar</h1>
    <p class="role">AI Researcher · Medical AI Evaluator</p>
    <p class="tag">Every piece of my work, mapped onto one strand. Scroll to travel it. Click any node to open its map.</p>
  </div>

  <nav class="groups" id="groups" aria-label="Sections"></nav>

  <div class="panel-foot">
    <a class="ghost" href="index.html">← Classic view</a>
    <a class="solid" href="cv/Adnan_Shamim_Dar_CV.pdf">CV</a>
  </div>
</aside>

<p class="scroll-hint" id="hint"><span class="mouse"></span>Scroll the strand · click a node</p>

<!-- mind map -->
<div class="mm" id="mm" role="dialog" aria-modal="true" aria-labelledby="mm-title" hidden>
  <svg class="mm-lines" id="mm-lines" aria-hidden="true"></svg>
  <div class="mm-center" id="mm-center">
    <p class="mm-kicker" id="mm-kicker"></p>
    <h2 id="mm-title"></h2>
    <p class="mm-hook" id="mm-hook"></p>
  </div>
  <div class="mm-branches" id="mm-branches"></div>
  <button class="mm-nav prev" id="mm-prev" aria-label="Previous node">←</button>
  <button class="mm-nav next" id="mm-next" aria-label="Next node">→</button>
  <button class="mm-close" id="mm-close" aria-label="Close map">Esc ×</button>
</div>

<div id="space" class="space"></div>

<noscript>
  <style>.panel{position:static}.space,canvas,.nodes,.scroll-hint{display:none}</style>
  <p style="padding:24px">This view needs JavaScript. <a href="index.html">Open the classic portfolio</a>.</p>
</noscript>

<script src="helix.js?v=2" defer></script>
</body>
</html>
